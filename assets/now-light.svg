<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Checago Coffee: ransomware wiped the database in week one; rebuilt the MySQL schema, moved to AWS RDS and EC2, set up CI/CD and migrated the Android app, website and 158 PHP endpoints.">
<title>Checago Coffee: ransomware wiped the database in week one; rebuilt the MySQL schema, moved to AWS RDS and EC2, set up CI/CD and migrated the Android app, website and 158 PHP endpoints.</title>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.prog { stroke-dasharray: 800; animation: prog 8s ease-in-out infinite; }
@keyframes prog { 0% { stroke-dashoffset: 800 } 60%,100% { stroke-dashoffset: 0 } }
.node { opacity: .4; animation: lit 8s ease-out infinite; }
@keyframes lit { 0% { opacity: .4 } 8%,90% { opacity: 1 } 100% { opacity: .4 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="999" height="219" rx="6" fill="#ffffff" stroke="#d1d9e0"/>
<text x="20" y="34" font-size="15" font-weight="600" fill="#1f2328">Full-Stack Software Developer Intern <tspan font-weight="400" fill="#59636e">at Checago Coffee</tspan></text>
<g transform="translate(843 19)"><rect x="0.5" y="0.5" width="136" height="19" rx="9.5" fill="none" stroke="#1a7f37"/><text x="68.5" y="14" text-anchor="middle" font-size="12" font-weight="500" fill="#1a7f37">May 2026 – present</text></g>
<line x1="20" y1="52" x2="980" y2="52" stroke="#eaeef2"/>
<line x1="100" y1="112" x2="900" y2="112" stroke="#d1d9e0" stroke-width="2"/>
<line class="prog" x1="100" y1="112" x2="900" y2="112" stroke="#1a7f37" stroke-width="2"/>
<g class="node" style="animation-delay:0s">
  <circle cx="100" cy="112" r="9" fill="#ffffff" stroke="#d1242f" stroke-width="1.5"/>
  <circle cx="100" cy="112" r="3.5" fill="#d1242f"/>
  <text x="100" y="92" text-anchor="middle" font-size="12" fill="#59636e">Week 1</text>
  <text x="100" y="144" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2328">Ransomware wipes</text>
  <text x="100" y="162" text-anchor="middle" font-size="12.5" fill="#59636e">the database</text>
</g>
<g class="node" style="animation-delay:1.1s">
  <circle cx="300" cy="112" r="9" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/>
  <circle cx="300" cy="112" r="3.5" fill="#9a6700"/>
  <text x="300" y="92" text-anchor="middle" font-size="12" fill="#59636e">Rebuild</text>
  <text x="300" y="144" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2328">47-table MySQL</text>
  <text x="300" y="162" text-anchor="middle" font-size="12.5" fill="#59636e">schema restored</text>
</g>
<g class="node" style="animation-delay:2.2s">
  <circle cx="500" cy="112" r="9" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <circle cx="500" cy="112" r="3.5" fill="#0969da"/>
  <text x="500" y="92" text-anchor="middle" font-size="12" fill="#59636e">Cloud</text>
  <text x="500" y="144" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2328">Moved to AWS</text>
  <text x="500" y="162" text-anchor="middle" font-size="12.5" fill="#59636e">RDS + EC2</text>
</g>
<g class="node" style="animation-delay:3.3s">
  <circle cx="700" cy="112" r="9" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/>
  <circle cx="700" cy="112" r="3.5" fill="#8250df"/>
  <text x="700" y="92" text-anchor="middle" font-size="12" fill="#59636e">Ship</text>
  <text x="700" y="144" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2328">GitHub → AWS</text>
  <text x="700" y="162" text-anchor="middle" font-size="12.5" fill="#59636e">CI/CD pipeline</text>
</g>
<g class="node" style="animation-delay:4.4s">
  <circle cx="900" cy="112" r="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <circle cx="900" cy="112" r="3.5" fill="#1a7f37"/>
  <text x="900" y="92" text-anchor="middle" font-size="12" fill="#59636e">Migrate</text>
  <text x="900" y="144" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2328">Android, site + 158</text>
  <text x="900" y="162" text-anchor="middle" font-size="12.5" fill="#59636e">PHP endpoints</text>
</g>
<text x="500" y="204" text-anchor="middle" class="mono" font-size="12" fill="#59636e">47 tables · 158 PHP endpoints · 11 admin pages · Google Sign-In · OSRM routing</text>
</svg>
