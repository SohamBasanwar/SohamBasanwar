<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="Checago Coffee: ransomware wiped the database in week one; rebuilt the MySQL schema, moved to AWS RDS and EC2, set up CI/CD and migrated the Android app, website and 158 PHP endpoints.">
<title>Checago Coffee: ransomware wiped the database in week one; rebuilt the MySQL schema, moved to AWS RDS and EC2, set up CI/CD and migrated the Android app, website and 158 PHP endpoints.</title>
<style>
text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace; }
.edge { animation: edge 5s ease-in-out infinite; }
@keyframes edge { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
.prog { stroke-dasharray: 820; animation: prog 8s ease-in-out infinite; }
@keyframes prog { 0% { stroke-dashoffset: 820 } 60%,100% { stroke-dashoffset: 0 } }
.node { opacity: .35; animation: lit 8s ease-out infinite; }
@keyframes lit { 0% { opacity: .35 } 8%,90% { opacity: 1 } 100% { opacity: .35 } }
.blip { animation: blipk 2s ease-in-out infinite; } @keyframes blipk { 50% { opacity: .25 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="now-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1224"/><stop offset="1" stop-color="#05070d"/>
  </linearGradient>
  <linearGradient id="now-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4ade80" stop-opacity="0.9"/>
    <stop offset="0.5" stop-color="#4ade80" stop-opacity="0.15"/>
    <stop offset="1" stop-color="#4ade80" stop-opacity="0.7"/>
  </linearGradient>
</defs>
<rect x="1" y="1" width="998" height="268" rx="16" fill="url(#now-bg)"/>
<rect class="edge" x="1" y="1" width="998" height="268" rx="16" fill="none" stroke="url(#now-edge)" stroke-width="1.5"/>
<defs><linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="0.5" stop-color="#38bdf8"/><stop offset="1" stop-color="#4ade80"/></linearGradient></defs>
<g transform="translate(28 24)"><rect width="212" height="22" rx="11" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-opacity="0.5"/><circle class="blip" cx="12" cy="11" r="3.5" fill="#4ade80"/><text x="22" y="15.5" class="mono" font-size="11" letter-spacing="1.5" fill="#4ade80">NOW · MAY 2026 – PRESENT</text></g>
<text x="28" y="80" font-size="22" font-weight="700" fill="#e8eef7">Full-Stack Software Developer Intern · Checago Coffee</text>
<text x="972" y="40" text-anchor="end" class="mono" font-size="12" fill="#8d9bb3">incident → rebuild</text>
<line x1="90" y1="150" x2="910" y2="150" stroke="#1c2740" stroke-width="4" stroke-linecap="round"/>
<line class="prog" x1="90" y1="150" x2="910" y2="150" stroke="url(#pg)" stroke-width="4" stroke-linecap="round"/>
<g class="node" style="animation-delay:0s">
  <circle cx="90" cy="150" r="16" fill="#0a0f1d" stroke="#fb7185" stroke-width="2"/>
  <circle cx="90" cy="150" r="6" fill="#fb7185"/>
  <text x="90" y="120" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#fb7185">WEEK 1</text>
  <text x="90" y="192" text-anchor="middle" font-size="14.5" font-weight="600" fill="#e8eef7">Ransomware wipes</text>
  <text x="90" y="211" text-anchor="middle" font-size="13.5" fill="#8d9bb3">the database</text>
</g>
<g class="node" style="animation-delay:1.1s">
  <circle cx="295" cy="150" r="16" fill="#0a0f1d" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="295" cy="150" r="6" fill="#fbbf24"/>
  <text x="295" y="120" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#fbbf24">REBUILD</text>
  <text x="295" y="192" text-anchor="middle" font-size="14.5" font-weight="600" fill="#e8eef7">47-table MySQL</text>
  <text x="295" y="211" text-anchor="middle" font-size="13.5" fill="#8d9bb3">schema restored</text>
</g>
<g class="node" style="animation-delay:2.2s">
  <circle cx="500" cy="150" r="16" fill="#0a0f1d" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="500" cy="150" r="6" fill="#38bdf8"/>
  <text x="500" y="120" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#38bdf8">CLOUD</text>
  <text x="500" y="192" text-anchor="middle" font-size="14.5" font-weight="600" fill="#e8eef7">Moved to AWS</text>
  <text x="500" y="211" text-anchor="middle" font-size="13.5" fill="#8d9bb3">RDS + EC2</text>
</g>
<g class="node" style="animation-delay:3.3s">
  <circle cx="705" cy="150" r="16" fill="#0a0f1d" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="705" cy="150" r="6" fill="#a78bfa"/>
  <text x="705" y="120" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#a78bfa">SHIP</text>
  <text x="705" y="192" text-anchor="middle" font-size="14.5" font-weight="600" fill="#e8eef7">GitHub → AWS</text>
  <text x="705" y="211" text-anchor="middle" font-size="13.5" fill="#8d9bb3">CI/CD pipeline</text>
</g>
<g class="node" style="animation-delay:4.4s">
  <circle cx="910" cy="150" r="16" fill="#0a0f1d" stroke="#4ade80" stroke-width="2"/>
  <circle cx="910" cy="150" r="6" fill="#4ade80"/>
  <text x="910" y="120" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#4ade80">MIGRATE</text>
  <text x="910" y="192" text-anchor="middle" font-size="14.5" font-weight="600" fill="#e8eef7">Android, site + 158</text>
  <text x="910" y="211" text-anchor="middle" font-size="13.5" fill="#8d9bb3">PHP endpoints</text>
</g>
<text x="500" y="252" text-anchor="middle" class="mono" font-size="12" fill="#8d9bb3">47 tables · 158 PHP endpoints · 11 admin pages · Google Sign-In · OSRM routing</text>
</svg>
