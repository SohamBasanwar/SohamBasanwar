<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220" role="img" aria-label="Checkers Online — Networked two-player checkers with a live server dashboard. Three Maven modules, 67 tests.">
<title>Checkers Online — Networked two-player checkers with a live server dashboard. Three Maven modules, 67 tests.</title>
<style>
