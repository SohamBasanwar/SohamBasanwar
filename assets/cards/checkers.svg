.blip { animation: blipk 2s ease-in-out infinite; } @keyframes blipk { 50% { opacity: .25 } }
.hop { animation: hop 3s ease-in-out infinite; } @keyframes hop { 0%,20% { transform: translate(0,0) } 45%,65% { transform: translate(17px,-15px) } 90%,100% { transform: translate(34px,-30px); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
