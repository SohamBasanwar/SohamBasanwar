<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220" role="img" aria-label="Simple Weather — Live NWS forecasts with 16 animated conditions, alerts, favorites and Bear the mascot. 70 tests.">
<title>Simple Weather — Live NWS forecasts with 16 animated conditions, alerts, favorites and Bear the mascot. 70 tests.</title>
<style>
text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace; }
.edge { animation: edge 5s ease-in-out infinite; }
@keyframes edge { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
.blip { animation: blipk 2s ease-in-out infinite; } @keyframes blipk { 50% { opacity: .25 } }
.drop { animation: fall 1.6s linear infinite; } @keyframes fall { from { transform: translateY(0); opacity: 1 } to { transform: translateY(22px); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
