<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220" role="img" aria-label="PersistAI — Matches your résumé to a job post, scores each entry and builds an ATS-ready PDF.">
<title>PersistAI — Matches your résumé to a job post, scores each entry and builds an ATS-ready PDF.</title>
<style>
text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace; }
.edge { animation: edge 5s ease-in-out infinite; }
@keyframes edge { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
.blip { animation: blipk 2s ease-in-out infinite; } @keyframes blipk { 50% { opacity: .25 } }
.bar { transform-box: fill-box; animation: grow 4s ease-out infinite; } @keyframes grow { 0% { transform: scaleX(0) } 45%,100% { transform: scaleX(1) } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1224"/><stop offset="1" stop-color="#05070d"/>
  </linearGradient>
  <linearGradient id="c-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#38bdf8" stop-opacity="0.9"/>
    <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.15"/>
    <stop offset="1" stop-color="#38bdf8" stop-opacity="0.7"/>
  </linearGradient>
</defs>
<rect x="1" y="1" width="418" height="218" rx="16" fill="url(#c-bg)"/>
<rect class="edge" x="1" y="1" width="418" height="218" rx="16" fill="none" stroke="url(#c-edge)" stroke-width="1.5"/>
<g transform="translate(24 24)"><rect width="83" height="22" rx="11" fill="#5eead4" fill-opacity="0.12" stroke="#5eead4" stroke-opacity="0.5"/><circle class="blip" cx="12" cy="11" r="3.5" fill="#5eead4"/><text x="22" y="15.5" class="mono" font-size="11" letter-spacing="1.5" fill="#5eead4">SHIPPED</text></g>
<g transform="translate(288 26)"><rect x="0" y="0" width="104" height="10" rx="5" fill="#1c2740"/><rect class="bar" x="0" y="0" width="95.7" height="10" rx="5" fill="#38bdf8" style="animation-delay:0s"/><rect x="0" y="20" width="104" height="10" rx="5" fill="#1c2740"/><rect class="bar" x="0" y="20" width="72.8" height="10" rx="5" fill="#38bdf8" style="animation-delay:0.25s"/><rect x="0" y="40" width="104" height="10" rx="5" fill="#1c2740"/><rect class="bar" x="0" y="40" width="46.8" height="10" rx="5" fill="#38bdf8" style="animation-delay:0.5s"/></g>
<text x="24" y="82" font-size="25" font-weight="700" fill="#e8eef7">PersistAI</text>
<text x="24" y="112" font-size="14.5" fill="#8d9bb3">Matches your résumé to a job post, scores each</text>
<text x="24" y="133" font-size="14.5" fill="#8d9bb3">entry and builds an ATS-ready PDF.</text>
<g transform="translate(24 172)"><rect width="103" height="24" rx="12" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.4"/><text x="51.5" y="16.5" text-anchor="middle" class="mono" font-size="12" fill="#e8eef7">React Native</text></g><g transform="translate(135 172)"><rect width="54" height="24" rx="12" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.4"/><text x="27" y="16.5" text-anchor="middle" class="mono" font-size="12" fill="#e8eef7">Flask</text></g><g transform="translate(197 172)"><rect width="75" height="24" rx="12" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.4"/><text x="37.5" y="16.5" text-anchor="middle" class="mono" font-size="12" fill="#e8eef7">Firebase</text></g><g transform="translate(280 172)"><rect width="32" height="24" rx="12" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.4"/><text x="16" y="16.5" text-anchor="middle" class="mono" font-size="12" fill="#e8eef7">AI</text></g>
</svg>
