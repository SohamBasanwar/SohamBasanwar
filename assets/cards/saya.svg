<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220" role="img" aria-label="Saya — An emotion-aware chatbot that reads the mood of a conversation and answers to match it.">
<title>Saya — An emotion-aware chatbot that reads the mood of a conversation and answers to match it.</title>
<style>
text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
