.edge { animation: edge 5s ease-in-out infinite; }
@keyframes edge { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
.blip { animation: blipk 2s ease-in-out infinite; } @keyframes blipk { 50% { opacity: .25 } }
.emo { animation: emo 6s infinite; transform-box: fill-box; transform-origin: center; } @keyframes emo { 0%,100% { fill: #fb7185; transform: scale(1) } 25% { fill: #fbbf24; transform: scale(1.25) } 50% { fill: #38bdf8; transform: scale(1) } 75% { fill: #a78bfa; transform: scale(1.2) } }
