<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220" viewBox="0 0 300 220" role="img" aria-label="Dual-Reality Maze — A two-player Arduino maze game with a story I wrote myself.">
<title>Dual-Reality Maze — A two-player Arduino maze game with a story I wrote myself.</title>
<style>
text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace; }
.edge { animation: edge 5s ease-in-out infinite; }
@keyframes edge { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
.blip { animation: blipk 2s ease-in-out infinite; } @keyframes blipk { 50% { opacity: .25 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1224"/><stop offset="1" stop-color="#05070d"/>
  </linearGradient>
  <linearGradient id="c-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fb7185" stop-opacity="0.9"/>
    <stop offset="0.5" stop-color="#fb7185" stop-opacity="0.15"/>
    <stop offset="1" stop-color="#fb7185" stop-opacity="0.7"/>
  </linearGradient>
</defs>
<rect x="1" y="1" width="298" height="218" rx="16" fill="url(#c-bg)"/>
<rect class="edge" x="1" y="1" width="298" height="218" rx="16" fill="none" stroke="url(#c-edge)" stroke-width="1.5"/>
<g transform="translate(20 20)"><rect width="106" height="22" rx="11" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.5"/><circle class="blip" cx="12" cy="11" r="3.5" fill="#fbbf24"/><text x="22" y="15.5" class="mono" font-size="11" letter-spacing="1.5" fill="#fbbf24">IN THE LAB</text></g>
<g transform="translate(172 22)"><path d="M0 0H104V60H0Z M20 0V40 M40 20V60 M60 0V40 M80 20V60" fill="none" stroke="#1c2740" stroke-width="2"/><path d="M10 50 V10 H30 V50 H50 V10 H70 V50 H90 V10" fill="none" stroke="#fb7185" stroke-opacity="0.25" stroke-dasharray="2 4"/>
<circle r="4.5" fill="#fb7185"><animateMotion dur="6s" repeatCount="indefinite" path="M10 50 V10 H30 V50 H50 V10 H70 V50 H90 V10"/></circle>
</g>
<text x="20" y="100" font-size="21" font-weight="700" fill="#e8eef7">Dual-Reality Maze</text>
<text x="20" y="130" font-size="13.5" fill="#8d9bb3">A two-player Arduino maze game</text>
<text x="20" y="151" font-size="13.5" fill="#8d9bb3">with a story I wrote myself.</text>
<g transform="translate(20 176)"><rect width="68" height="24" rx="12" fill="#fb7185" fill-opacity="0.1" stroke="#fb7185" stroke-opacity="0.4"/><text x="34" y="16.5" text-anchor="middle" class="mono" font-size="12" fill="#e8eef7">Arduino</text></g><g transform="translate(96 176)"><rect width="39" height="24" rx="12" fill="#fb7185" fill-opacity="0.1" stroke="#fb7185" stroke-opacity="0.4"/><text x="19.5" y="16.5" text-anchor="middle" class="mono" font-size="12" fill="#e8eef7">C++</text></g><g transform="translate(143 176)"><rect width="61" height="24" rx="12" fill="#fb7185" fill-opacity="0.1" stroke="#fb7185" stroke-opacity="0.4"/><text x="30.5" y="16.5" text-anchor="middle" class="mono" font-size="12" fill="#e8eef7">Canvas</text></g>
</svg>
