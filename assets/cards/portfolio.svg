<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220" role="img" aria-label="Portfolio — My site as a world to explore, with a 3D guide who walks visitors through my work.">
<title>Portfolio — My site as a world to explore, with a 3D guide who walks visitors through my work.</title>
<style>
text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace; }
.edge { animation: edge 5s ease-in-out infinite; }
@keyframes edge { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
.blip { animation: blipk 2s ease-in-out infinite; } @keyframes blipk { 50% { opacity: .25 } }
.spin { animation: spin 5s linear infinite; transform-origin: 52px 30px; } @keyframes spin { to { transform: rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1224"/><stop offset="1" stop-color="#05070d"/>
  </linearGradient>
  <linearGradient id="c-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5eead4" stop-opacity="0.9"/>
    <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.15"/>
    <stop offset="1" stop-color="#5eead4" stop-opacity="0.7"/>
  </linearGradient>
</defs>
<rect x="1" y="1" width="418" height="218" rx="16" fill="url(#c-bg)"/>
<rect class="edge" x="1" y="1" width="418" height="218" rx="16" fill="none" stroke="url(#c-edge)" stroke-width="1.5"/>
