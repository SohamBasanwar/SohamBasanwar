<g transform="translate(288 26)"><circle cx="52" cy="30" r="9" fill="#5eead4" fill-opacity="0.85"/><ellipse cx="52" cy="30" rx="44" ry="16" fill="none" stroke="#5eead4" stroke-opacity="0.3"/><ellipse cx="52" cy="30" rx="28" ry="28" fill="none" stroke="#38bdf8" stroke-opacity="0.2"/>
<g class="spin"><circle cx="96" cy="30" r="3.5" fill="#fb7185"/><circle cx="8" cy="30" r="2.5" fill="#5eead4"/></g>
</g>
