<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220" viewBox="0 0 300 220" role="img" aria-label="Project Helios — A local-first AI assistant you can talk to or wave at. Data stays home.">
<title>Project Helios — A local-first AI assistant you can talk to or wave at. Data stays home.</title>
<style>
text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace; }
.edge { animation: edge 5s ease-in-out infinite; }
@keyframes edge { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
.blip { animation: blipk 2s ease-in-out infinite; } @keyframes blipk { 50% { opacity: .25 } }
.spin { animation: spin 9s linear infinite; transform-origin: 52px 30px; } @keyframes spin { to { transform: rotate(360deg) } }
.core { animation: glowc 2.4s ease-in-out infinite; } @keyframes glowc { 50% { fill-opacity: .45 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1224"/><stop offset="1" stop-color="#05070d"/>
  </linearGradient>
  <linearGradient id="c-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
    <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.15"/>
    <stop offset="1" stop-color="#fbbf24" stop-opacity="0.7"/>
  </linearGradient>
</defs>
<rect x="1" y="1" width="298" height="218" rx="16" fill="url(#c-bg)"/>
<rect class="edge" x="1" y="1" width="298" height="218" rx="16" fill="none" stroke="url(#c-edge)" stroke-width="1.5"/>
<g transform="translate(20 20)"><rect width="106" height="22" rx="11" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.5"/><circle class="blip" cx="12" cy="11" r="3.5" fill="#fbbf24"/><text x="22" y="15.5" class="mono" font-size="11" letter-spacing="1.5" fill="#fbbf24">IN THE LAB</text></g>
<g transform="translate(172 22)"><circle cx="52" cy="30" r="12" fill="#fbbf24" fill-opacity="0.85" class="core"/><g class="spin"><circle cx="78" cy="30" r="3" fill="#fbbf24"/><circle cx="74.5" cy="43" r="1.8" fill="#fbbf24"/><circle cx="65" cy="52.5" r="1.8" fill="#fbbf24"/><circle cx="52" cy="56" r="3" fill="#fbbf24"/><circle cx="39" cy="52.5" r="1.8" fill="#fbbf24"/><circle cx="29.5" cy="43" r="1.8" fill="#fbbf24"/><circle cx="26" cy="30" r="3" fill="#fbbf24"/><circle cx="29.5" cy="17" r="1.8" fill="#fbbf24"/><circle cx="39" cy="7.5" r="1.8" fill="#fbbf24"/><circle cx="52" cy="4" r="3" fill="#fbbf24"/><circle cx="65" cy="7.5" r="1.8" fill="#fbbf24"/><circle cx="74.5" cy="17" r="1.8" fill="#fbbf24"/></g></g>
<text x="20" y="100" font-size="21" font-weight="700" fill="#e8eef7">Project Helios</text>
<text x="20" y="130" font-size="13.5" fill="#8d9bb3">A local-first AI assistant you can</text>
<text x="20" y="151" font-size="13.5" fill="#8d9bb3">talk to or wave at. Data stays home.</text>
<g transform="translate(20 176)"><rect width="54" height="24" rx="12" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.4"/><text x="27" y="16.5" text-anchor="middle" class="mono" font-size="12" fill="#e8eef7">Tauri</text></g><g transform="translate(82 176)"><rect width="75" height="24" rx="12" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.4"/><text x="37.5" y="16.5" text-anchor="middle" class="mono" font-size="12" fill="#e8eef7">Three.js</text></g><g transform="translate(165 176)"><rect width="82" height="24" rx="12" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.4"/><text x="41" y="16.5" text-anchor="middle" class="mono" font-size="12" fill="#e8eef7">llama.cpp</text></g>
