<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220" viewBox="0 0 300 220" role="img" aria-label="CommandFlow AI — Tell it the work; it plans when to start and always keeps a buffer.">
<title>CommandFlow AI — Tell it the work; it plans when to start and always keeps a buffer.</title>
<style>
text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace; }
.edge { animation: edge 5s ease-in-out infinite; }
@keyframes edge { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
.blip { animation: blipk 2s ease-in-out infinite; } @keyframes blipk { 50% { opacity: .25 } }
.now { animation: now 5s linear infinite; } @keyframes now { from { transform: translateX(0) } to { transform: translateX(102px) } }
.buf { animation: buf 1.6s ease-in-out infinite; } @keyframes buf { 50% { stroke-opacity: .3 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1224"/><stop offset="1" stop-color="#05070d"/>
  </linearGradient>
  <linearGradient id="c-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a78bfa" stop-opacity="0.9"/>
    <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.15"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0.7"/>
  </linearGradient>
</defs>
<rect x="1" y="1" width="298" height="218" rx="16" fill="url(#c-bg)"/>
<rect class="edge" x="1" y="1" width="298" height="218" rx="16" fill="none" stroke="url(#c-edge)" stroke-width="1.5"/>
<g transform="translate(20 20)"><rect width="106" height="22" rx="11" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.5"/><circle class="blip" cx="12" cy="11" r="3.5" fill="#fbbf24"/><text x="22" y="15.5" class="mono" font-size="11" letter-spacing="1.5" fill="#fbbf24">IN THE LAB</text></g>
<g transform="translate(172 22)"><rect x="0" y="6" width="104" height="2" fill="#1c2740"/>
<rect x="0" y="16" width="34" height="14" rx="4" fill="#a78bfa" fill-opacity="0.8"/><rect x="40" y="16" width="26" height="14" rx="4" fill="#38bdf8" fill-opacity="0.7"/>
<rect class="buf" x="72" y="16" width="32" height="14" rx="4" fill="none" stroke="#fbbf24" stroke-dasharray="3 3"/><text x="88" y="45" text-anchor="middle" class="mono" font-size="9" fill="#fbbf24">buffer</text>
<rect class="now" x="0" y="2" width="2" height="34" fill="#fb7185"/></g>
<text x="20" y="100" font-size="21" font-weight="700" fill="#e8eef7">CommandFlow AI</text>
<text x="20" y="130" font-size="13.5" fill="#8d9bb3">Tell it the work; it plans when to</text>
<text x="20" y="151" font-size="13.5" fill="#8d9bb3">start and always keeps a buffer.</text>
<g transform="translate(20 176)"><rect width="54" height="24" rx="12" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.4"/><text x="27" y="16.5" text-anchor="middle" class="mono" font-size="12" fill="#e8eef7">React</text></g><g transform="translate(82 176)"><rect width="68" height="24" rx="12" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.4"/><text x="34" y="16.5" text-anchor="middle" class="mono" font-size="12" fill="#e8eef7">FastAPI</text></g><g transform="translate(158 176)"><rect width="39" height="24" rx="12" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.4"/><text x="19.5" y="16.5" text-anchor="middle" class="mono" font-size="12" fill="#e8eef7">NLP</text></g>
</svg>
