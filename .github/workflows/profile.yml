name: Refresh profile images

on:
  schedule:
    - cron: "17 8 * * *" # about 3 am in Chicago
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "generated/**"
      - "profile-3d-contrib/**"

permissions:
  contents: write

concurrency:
  group: profile-images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stats and languages cards
        run: node scripts/build-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d.json

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            generated/snake-light.svg?palette=github-light
            generated/snake-dark.svg?palette=github-dark

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated profile-3d-contrib
          git diff --cached --quiet || git commit -m "chore: refresh profile images"
          git push
